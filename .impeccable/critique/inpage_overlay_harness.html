<!DOCTYPE html>
<!-- Critique harness: static mirror of the SMD in-page overlay DOM generated by
     src/content/content.js:1823-1910 (template literals) and styled by
     src/content/inpage_overlay.css inside a shadow root, as in production.
     Query params: ?theme=fb|reddit   theme variant
                   ?state=status|progress|empty   visible state variant
                   ?items=24   grid size -->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SMD overlay critique harness</title>
<style>
  /* Host-page stand-in: light-theme feed so scrim/FAB integration is visible */
  body { margin: 0; font-family: sans-serif; background: #ffffff; color: #222; }
  .host-feed { max-width: 720px; margin: 0 auto; padding: 24px 16px; }
  .host-post { background: #f2f2f2; border-radius: 8px; height: 140px; margin-bottom: 16px; }
  .host-post h2 { font-size: 16px; margin: 0 0 8px 0; color: #333; padding: 12px 12px 0; }
  .host-post .ph { background: #ddd; height: 96px; margin: 12px; border-radius: 6px; }
</style>
</head>
<body>
<div class="host-feed">
  <h1>Host page stand-in</h1>
  <p>Scroll target content beneath the extension overlay.</p>
  <div class="host-post"><h2>Post one</h2><div class="ph"></div></div>
  <div class="host-post"><h2>Post two</h2><div class="ph"></div></div>
  <div class="host-post"><h2>Post three</h2><div class="ph"></div></div>
  <div class="host-post"><h2>Post four</h2><div class="ph"></div></div>
  <div class="host-post"><h2>Post five</h2><div class="ph"></div></div>
</div>

<div id="smd-ui-root"></div>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const theme = q.get('theme');            // 'fb' | 'reddit' | null (instagram)
  const uiState = q.get('state');          // 'status' | 'progress' | 'empty' | null
  const itemCount = parseInt(q.get('items') || '12', 10);

  const root = document.getElementById('smd-ui-root');
  const shadow = root.attachShadow({ mode: 'open' });
  const stylesheet = document.createElement('link');
  stylesheet.rel = 'stylesheet';
  stylesheet.href = '../../src/content/inpage_overlay.css';
  shadow.appendChild(stylesheet);

  const isFb = theme === 'fb';
  const isReddit = theme === 'reddit';
  const modalTheme = isFb ? 'smd-fb-theme' : (isReddit ? 'smd-reddit-theme' : '');
  const fabTheme = isFb ? 'smd-fab-fb' : (isReddit ? 'smd-fab-reddit' : '');
  const chipClass = isFb ? 'smd-chip-fb' : (isReddit ? 'smd-chip-reddit' : '');
  const platformLabel = isFb ? 'Facebook' : (isReddit ? 'Reddit' : 'Instagram');

  const scanButtons = isFb
    ? '<button id="smd-scan-fb-page" class="smd-btn-action">Scan Page</button>' +
      '<button id="smd-scan-fb-tabs" class="smd-btn-action">Scan Photo Tabs</button>'
    : (isReddit
      ? '<button id="smd-scan-reddit" class="smd-btn-action">Scan Feed</button>'
      : '<button id="smd-scan-posts" class="smd-btn-action">Posts</button>' +
        '<button id="smd-scan-stories" class="smd-btn-action">Stories</button>' +
        '<button id="smd-scan-highlights" class="smd-btn-action">Highlights</button>' +
        '<button id="smd-scan-avatar" class="smd-btn-action">HD Profile Pic</button>');

  const extraFilterTabs = theme === null
    ? '<button class="smd-tab" data-filter="stories">Stories <span id="smd-t-stories">(0)</span></button>' +
      '<button class="smd-tab" data-filter="highlights">Highlights <span id="smd-t-highlights">(0)</span></button>'
    : (isReddit
      ? '<button class="smd-tab" data-filter="gallery">Galleries <span id="smd-t-gallery">(0)</span></button>' +
        '<button class="smd-tab" data-filter="redgifs">RedGifs <span id="smd-t-redgifs">(0)</span></button>'
      : '');

  // SVG data-URI thumbnail generator (deterministic, offline)
  function thumb(i) {
    const hues = [340, 210, 16, 140, 265, 45];
    const h = hues[i % hues.length];
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="hsl(' + h + ',55%,45%)"/>' +
      '<stop offset="1" stop-color="hsl(' + ((h + 40) % 360) + ',60%,25%)"/>' +
      '</linearGradient></defs>' +
      '<rect width="260" height="260" fill="url(#g)"/>' +
      '<circle cx="' + (60 + (i * 37) % 140) + '" cy="' + (60 + (i * 53) % 140) + '" r="34" fill="rgba(255,255,255,0.35)"/>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  const selectedCount = Math.max(1, Math.round(itemCount / 3));
  let gridHtml = '';
  for (let i = 0; i < itemCount; i++) {
    const selected = i < selectedCount;
    const isVideo = i % 5 === 2;
    const isCarousel = i % 7 === 3;
    gridHtml += '<div class="smd-grid-item' + (selected ? ' selected' : '') + '">' +
      '<img src="' + thumb(i) + '" alt="Preview" loading="lazy">' +
      '<div class="smd-check-overlay">' + (selected ? '&#10003;' : '') + '</div>' +
      (isCarousel ? '<span class="smd-tag smd-tag-format">' + (1 + (i % 5)) + '/5</span>'
        : (isVideo ? '<span class="smd-tag smd-tag-format">VIDEO</span>' : '')) +
      '<span class="smd-tag smd-tag-res">' + [1080, 720, 1440][i % 3] + 'x' + [1350, 1280, 1800][i % 3] + '</span>' +
      '</div>';
  }

  const statusBoxStyle = uiState === 'status' ? '' : ' style="display: none;"';
  const emptyStyle = uiState === 'empty' ? '' : ' style="display: none;"';
  const progressStyle = uiState === 'progress' ? '' : ' style="display: none;"';
  const gridStyle = uiState === 'empty' ? ' style="display: none;"' : '';
  const downloadDisabled = uiState === 'empty' ? ' disabled' : '';
  const tabCount = (n) => '(' + n + ')';
  const videoCount = itemCount - Math.ceil(itemCount / 5);

  const widget = document.createElement('div');
  widget.id = 'smd-floating-widget';
  widget.innerHTML =
    '<button class="smd-fab ' + fabTheme + '">' +
    '<span>Download</span><span class="smd-badge">' + selectedCount + '</span></button>';

  const modal = document.createElement('div');
  modal.id = 'smd-modal-overlay';
  modal.className = 'smd-modal-overlay ' + modalTheme;
  modal.style.display = 'flex'; // open by default in harness (production: none until FAB click)
  modal.setAttribute('role', 'dialog');
  modal.setAttribute('aria-modal', 'true');
  modal.setAttribute('aria-labelledby', 'smd-target-title');

  modal.innerHTML =
    '<div class="smd-modal-content">' +
      '<div class="smd-modal-header">' +
        '<div class="smd-header-info">' +
          '<img id="smd-target-avatar" class="smd-modal-avatar" alt="">' +
          '<div><h3 id="smd-target-title" class="smd-target-title">u/example_user</h3></div>' +
        '</div>' +
        '<div class="smd-header-right">' +
          '<button id="smd-modal-close" class="smd-close-btn" aria-label="Close">&times;</button>' +
        '</div>' +
      '</div>' +
      '<div class="smd-scanner-bar">' +
        '<button id="smd-scan-all" class="smd-btn-action smd-btn-primary">Scan All</button>' +
        scanButtons +
      '</div>' +
      '<div id="smd-status-box" class="smd-status-box"' + statusBoxStyle + '>' +
        '<div><span class="smd-spinner"></span><span class="smd-status-dot" style="display: none;"></span><span id="smd-status-text">Scanning&hellip;</span></div>' +
        '<button id="smd-cancel-scan" class="smd-cancel-btn">Stop Scan</button>' +
      '</div>' +
      '<div class="smd-filter-bar">' +
        '<div class="smd-filter-tabs" role="tablist">' +
          '<button class="smd-tab active" data-filter="all">All <span id="smd-t-all">' + tabCount(itemCount) + '</span></button>' +
          '<button class="smd-tab" data-filter="image">Photos <span id="smd-t-image">' + tabCount(itemCount - videoCount) + '</span></button>' +
          '<button class="smd-tab" data-filter="video">Videos <span id="smd-t-video">' + tabCount(videoCount) + '</span></button>' +
          extraFilterTabs +
        '</div>' +
      '</div>' +
      '<div class="smd-selection-bar">' +
        '<div>' +
          '<button id="smd-select-all" class="smd-link-btn">Select All</button>' +
          '<span style="margin: 0 4px;">&bull;</span>' +
          '<button id="smd-deselect-all" class="smd-link-btn">Deselect All</button>' +
        '</div>' +
        '<span id="smd-selection-summary">' + selectedCount + ' of ' + itemCount + ' selected</span>' +
      '</div>' +
      '<div id="smd-grid" class="smd-grid"' + gridStyle + '>' + gridHtml + '</div>' +
      '<div id="smd-empty" class="smd-empty-state"' + emptyStyle + '>' +
        '<p>No media captured yet</p>' +
        '<small>Click Scan or scroll the page to detect media in full original resolution.</small>' +
      '</div>' +
      '<div id="smd-download-progress-box" class="smd-progress-card"' + progressStyle + '>' +
        '<div class="smd-progress-header">' +
          '<span id="smd-progress-status-text">Downloading&hellip;</span>' +
          '<span id="smd-progress-percentage">42%</span>' +
        '</div>' +
        '<div class="smd-progress-track">' +
          '<div id="smd-progress-bar-fill" class="smd-progress-fill" style="width: 42%;"></div>' +
        '</div>' +
        '<button id="smd-btn-retry-download" class="smd-cancel-btn" style="display: none; align-self: flex-end; margin-top: 4px; border-color: #9e9ea7; color: #9e9ea7;">Retry</button>' +
        '<button id="smd-btn-cancel-download" class="smd-cancel-btn" style="align-self: flex-end; margin-top: 4px;">Cancel</button>' +
        '<div id="smd-receipt-actions" class="smd-receipt-actions" style="display: none;">' +
          '<button id="smd-btn-show-folder" class="smd-cancel-btn" style="border-color: #9e9ea7; color: #9e9ea7;">Show in folder</button>' +
        '</div>' +
      '</div>' +
      '<div class="smd-modal-footer">' +
        '<div class="smd-segmented">' +
          '<label class="smd-segment">' +
            '<input type="radio" name="smd-modal-format" value="zip" checked>' +
            '<span class="smd-segment-face">ZIP Archive</span>' +
          '</label>' +
          '<label class="smd-segment">' +
            '<input type="radio" name="smd-modal-format" value="individual">' +
            '<span class="smd-segment-face">In Folders</span>' +
          '</label>' +
        '</div>' +
        '<button id="smd-btn-start-download" class="smd-btn-download"' + downloadDisabled + '>' +
          '<span id="smd-download-text">Download Media</span>' +
        '</button>' +
      '</div>' +
    '</div>';

  shadow.appendChild(widget);
  shadow.appendChild(modal);

  // Mirror production bindings from src/content/content.js (roles applied at runtime)
  modal.querySelector('.smd-filter-tabs').setAttribute('role', 'tablist');
  modal.querySelectorAll('.smd-tab').forEach((tab) => tab.setAttribute('role', 'tab'));
  modal.querySelector('.smd-segmented').setAttribute('role', 'radiogroup');
  modal.querySelectorAll('.smd-grid-item').forEach((item) => {
    item.setAttribute('role', 'button');
    item.tabIndex = 0;
    item.setAttribute('aria-pressed', String(item.classList.contains('selected')));
    item.setAttribute('aria-label', 'Media item');
  });
  modal.querySelectorAll('.smd-grid-item').forEach((item) => {
    item.addEventListener('click', () => {
      const now = item.getAttribute('aria-pressed') !== 'true';
      item.setAttribute('aria-pressed', String(now));
      item.classList.toggle('selected', now);
      const check = item.querySelector('.smd-check-overlay');
      if (check) check.textContent = now ? '\u2713' : '';
    });
  });
  modal.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') {
      ev.stopPropagation();
      modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
      return;
    }
    if (ev.key === 'Enter' || ev.key === ' ') {
      const active = shadow.activeElement;
      if (active && active.classList && active.classList.contains('smd-grid-item')) {
        ev.preventDefault();
        active.click();
      }
    }
  });
})();
</script>
</body>
</html>
